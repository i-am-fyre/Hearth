# Hearth Configuration File
# Located at /etc/hearth/hearth.conf

# Database URL (postgresql://user:password@host:port/dbname)
# Ensure PostgreSQL is running and the database 'hearth' exists.
DATABASE_URL="postgresql://hearth:postgres@localhost:5432/hearth"

# Secret Key for session encryption
# CHANGE THIS to a long, random string in production
SECRET_KEY="your-super-secret-key-change-it-in-production"

# Port to serve the application on
PORT=8000

# Host (use 127.0.0.1 for local access only)
HOST=0.0.0.0
